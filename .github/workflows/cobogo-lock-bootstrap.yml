name: Cobogo lock bootstrap

on:
  push:
    branches: [reboot/cobogo-panda]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cobogo-lock-bootstrap
  cancel-in-progress: true

jobs:
  lock:
    if: ${{ !contains(github.event.head_commit.message, '[lock-bootstrap]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: reboot/cobogo-panda
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.8
      - name: Resolve dependency graph
        run: bun install
      - name: Commit lockfile
        shell: bash
        run: |
          if git diff --quiet -- bun.lock; then
            echo 'bun.lock already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bun.lock
          git commit -m 'build(web): refresh Bun lock [lock-bootstrap]'
          git push origin HEAD:reboot/cobogo-panda
