name: Visual Capture

on:
  pull_request:
    paths:
      - '**.html'
      - '**.css'
      - '**.js'
      - 'tests/**'
      - 'playwright.config.js'
      - 'package.json'
      - '.github/workflows/visual-capture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Render and capture
        run: npm run capture
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-capture
          path: artifacts/visual
          if-no-files-found: error
