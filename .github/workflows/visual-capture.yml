name: Visual capture

on:
  pull_request:
    paths:
      - 'src/**'
      - 'content/**'
      - '**.css'
      - 'astro.config.mjs'
      - 'package.json'
      - 'bun.lock'
      - 'AGENTS.md'
      - 'README.md'
      - 'publication/README.md'
      - 'skills/publication-review/SKILL.md'
      - 'docs/rfc/**'
      - 'scripts/build-publication.py'
      - 'scripts/check-astro-okf-contract.py'
      - 'scripts/check-cobogo-core.py'
      - 'scripts/check-public-surface.py'
      - 'scripts/capture-public-surface.sh'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/visual-capture.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'content/**'
      - '**.css'
      - 'astro.config.mjs'
      - 'package.json'
      - 'bun.lock'
      - 'AGENTS.md'
      - 'README.md'
      - 'publication/README.md'
      - 'skills/publication-review/SKILL.md'
      - 'docs/rfc/**'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/visual-capture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: 0.12.9
          enable-cache: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.8
      - name: Verify OKF → Astro contract
        run: python scripts/check-astro-okf-contract.py
      - name: Verify Cobogó foundation boundary
        run: python scripts/check-cobogo-core.py
      - name: Verify public newspaper contract
        run: python scripts/check-public-surface.py
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck Astro
        run: bun run check
      - name: Build Astro surface
        run: bun run build
      - name: Install Chromium
        run: bunx playwright@1.55.0 install --with-deps chromium
      - name: Capture rendered public surface
        run: bash scripts/capture-public-surface.sh dist
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-surface-capture
          path: artifacts/visual/
          if-no-files-found: error
          retention-days: 14
