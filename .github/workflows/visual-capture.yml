name: Visual capture

on:
  pull_request:
    paths:
      - '**.html'
      - '**.css'
      - '**.js'
      - 'scripts/capture-public-surface.sh'
      - '.github/workflows/visual-capture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: npx --yes playwright@1.55.0 install --with-deps chromium
      - name: Capture rendered home
        run: bash scripts/capture-public-surface.sh
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-surface-capture
          path: artifacts/visual/
          if-no-files-found: error
          retention-days: 14
