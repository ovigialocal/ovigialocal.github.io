name: Astro contract

on:
  pull_request:
    paths:
      - 'astro.config.mjs'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - 'src/**'
      - 'content/**'
      - 'scripts/check-astro-okf-contract.py'
      - '.github/workflows/astro-contract.yml'
  push:
    branches: [main]
    paths:
      - 'astro.config.mjs'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - 'src/**'
      - 'content/**'
      - 'scripts/check-astro-okf-contract.py'
      - '.github/workflows/astro-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astro-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: 0.12.9
          enable-cache: false

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.8

      - name: Verify OKF → Astro semantic contract
        run: python scripts/check-astro-okf-contract.py

      - name: Install locked Astro dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck Astro
        run: bun run check

      - name: Build static Astro surface
        run: bun run build
