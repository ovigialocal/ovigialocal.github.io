name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: 0.12.9
          enable-cache: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.8
      - name: Verify OKF semantic contract
        run: python scripts/check-astro-okf-contract.py
      - name: Verify public surface source contract
        run: python scripts/check-public-surface.py
      - name: Verify frozen Bun dependency graph
        run: bun install --frozen-lockfile
      - name: Install, build, and upload Astro site
        uses: withastro/action@v6
        with:
          package-manager: bun@1.3.8

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
