name: Astro foundation migration

on:
  push:
    branches: [refactor/astro-static-site]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: astro-foundation-migration
  cancel-in-progress: true

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/astro-static-site
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.0.1

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.8

      - name: Compile the public OKF contract for Astro
        run: python scripts/migrate-astro-foundation.py

      - name: Resolve the locked Astro toolchain
        shell: bash
        run: |
          if [[ -f bun.lock ]]; then
            bun install --frozen-lockfile
          else
            bun install
          fi

      - name: Typecheck Astro
        run: bun run check

      - name: Build static Astro proof
        run: bun run build

      - name: Commit deterministic generated artifacts
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/articles _news src/generated bun.lock
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'refactor(astro): materializar contrato OKF e lock'
          git push origin HEAD:refactor/astro-static-site
