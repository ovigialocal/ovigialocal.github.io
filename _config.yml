title: O Vigia
url: https://ovigialocal.github.io
lang: pt-BR
timezone: America/Porto_Velho

collections:
  news:
    output: true
    permalink: /noticias/:name/

defaults:
  - scope:
      path: ""
      type: news
    values:
      layout: news

exclude:
  - content
  - docs
  - publication
  - scripts
  - skills
  - src
  - astro.config.mjs
  - package.json
  - bun.lock
  - tsconfig.json
  - AGENTS.md
  - README.md
  - LICENSE-CODE
  - LICENSE-CONTENT
